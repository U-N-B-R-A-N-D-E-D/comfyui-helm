[project]
name = "comfyui-helm"
description = "Training-free activation steering for ComfyUI: read a transformer block's direction between two prompts and inject it with a single strength scalar. Open weights only."
version = "0.5.0-dev"
readme = "README.md"
authors = [{ name = "[ U N B R A N D E D ] / KAFEIN" }]
keywords = ["comfyui", "activation-steering", "diffusion", "video", "training-free"]
license = { file = "LICENSE" }
dependencies = ["safetensors", "numpy"]
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
Repository = "https://github.com/U-N-B-R-A-N-D-E-D/comfyui-helm"
Homepage = "https://www.kafein.agency/about#unbranded"

[tool.comfy]
PublisherId = "unbranded"
DisplayName = "Helm"
Icon = "https://raw.githubusercontent.com/U-N-B-R-A-N-D-E-D/comfyui-helm/main/icon.png"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--confcutdir=tests"
